[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medhorizon"
version = "0.1.0"
description = "Evaluation tools for full-procedure medical video understanding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
medhorizon = "medhorizon.__main__:main"

[tool.setuptools.packages.find]
include = ["medhorizon*"]
